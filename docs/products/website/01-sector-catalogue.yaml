slug: jgs-med-device-knowledge-packs
name: Medical Device Knowledge Packs
tagline: >
  Installable knowledge-pack skills for coding agents, reconstructed from genuinely
  open Medical Device bodies of knowledge, vetted, attributed, and shareable by
  construction.
product_class: agent-skills
status: live
version: "0.1.0"
repository: https://github.com/jgsystemsconsulting/jgs-med-device-knowledge-packs
license: MIT (tooling); pack content under each source's own licence
vendor: JG Systems Consulting Ltd.

positioning: >
  A knowledge pack turns a body of knowledge into a skill a coding agent loads on demand.
  This is a curated catalogue of those packs for Medical Device, built so only genuinely
  open sources go in. Eligibility is enforced, not assumed, and every pack is
  redistributable by construction.

audience:
  - Practitioners working in Medical Device
  - Anyone using a coding agent who needs grounded Medical Device reference answers

features:
  - title: Licence-vetted by construction
    detail: >
      Every source clears a written eligibility rubric; each pack carries its source's
      licence and attribution.
  - title: Progressive disclosure
    detail: >
      Each pack is an always-loaded SKILL.md index plus on-demand chapters, so a large
      body of knowledge never fills the context window.
  - title: /med orchestrator
    detail: >
      An explicit /med <question> entry point for when you do not know which
      pack to ask. Routes through a curated topic map to the right packs. Carries no
      source content itself.
  - title: Open Agent Skills format, multi-agent install
    detail: >
      Packs follow the open agentskills.io SKILL.md standard. One stdlib-only installer
      targets multiple coding agents.
  - title: No runtime dependencies
    detail: >
      Plain Markdown. No MCP server, API key, or licence tier needed at runtime.

links:
  repository: https://github.com/jgsystemsconsulting/jgs-med-device-knowledge-packs
  changelog: https://github.com/jgsystemsconsulting/jgs-med-device-knowledge-packs/blob/main/CHANGELOG.md
  skills_index: https://github.com/jgsystemsconsulting/jgs-med-device-knowledge-packs/blob/main/SKILLS.md
